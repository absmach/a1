# Proplet configuration
PROPLET_SERVER_URL=http://your-server:8080

# Logging
PROPLET_LOG_LEVEL=info

# Instance identification
PROPLET_INSTANCE_ID=auto-generated

# MQTT configuration
PROPLET_MQTT_ADDRESS=tcp://localhost:1883
PROPLET_MQTT_TIMEOUT=30
PROPLET_MQTT_QOS=2

# SuperMQ credentials
PROPLET_DOMAIN_ID=your-domain-id
PROPLET_CHANNEL_ID=your-channel-id
PROPLET_CLIENT_ID=your-client-id
PROPLET_CLIENT_KEY=your-client-key

# Optional: External WebAssembly runtime
# PROPLET_EXTERNAL_WASM_RUNTIME=/path/to/external/runtime

# Optional: Kubernetes namespace
PROPLET_MANAGER_K8S_NAMESPACE=default

# Liveliness interval (seconds)
PROPLET_LIVELINESS_INTERVAL=10