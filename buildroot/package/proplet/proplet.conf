# Proplet Configuration for BeagleV
# Edit this file and restart proplet: systemctl restart proplet

# ============================================================================
# Logging
# ============================================================================
PROPLET_LOG_LEVEL=info

# ============================================================================
# Instance Identification
# ============================================================================
# Leave empty for auto-generated ID, or set a custom ID
PROPLET_INSTANCE_ID=

# ============================================================================
# MQTT Configuration
# ============================================================================
PROPLET_MQTT_ADDRESS=tcp://your-broker-ip:1883
PROPLET_MQTT_TIMEOUT=30
PROPLET_MQTT_QOS=2

# ============================================================================
# SuperMQ Credentials (Required)
# ============================================================================
# Get these values from your SuperMQ/Magistrala deployment
PROPLET_DOMAIN_ID=your-domain-id
PROPLET_CHANNEL_ID=your-channel-id
PROPLET_CLIENT_ID=your-client-id
PROPLET_CLIENT_KEY=your-client-key

# ============================================================================
# WebAssembly Runtime Configuration
# ============================================================================
# Path to external wasmtime binary
PROPLET_WASM_RUNTIME=/usr/bin/wasmtime

# Working directories for WASM workloads
PROPLET_WASM_CACHE_DIR=/var/lib/proplet/wasm-cache
PROPLET_WORKLOADS_DIR=/var/lib/proplet/workloads

# ============================================================================
# Liveliness Configuration
# ============================================================================
# Interval in seconds to report liveliness to manager
PROPLET_LIVELINESS_INTERVAL=10